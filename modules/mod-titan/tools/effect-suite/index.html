<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emberforge Effect Suite</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a forge workbench. Library and layers on the left, the stage (Hero, training dummy) in the middle with the
   timeline under it, the inspector on the right. One deliberately dark look: effects read on dark. */
:root {
  --bg: #100e12;
  --panel: #18151b;
  --panel-2: #201c24;
  --line: #2f2934;
  --text: #ece5dc;
  --muted: #998f97;
  --ember: #ff8a3d;
  --ember-soft: #ff8a3d22;
  --ember-ink: #1a0d04;
  --good: #7fd18b;
  --danger: #ff6b6b;
  --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }

.app {
  height: 100%; display: grid; gap: 8px;
  grid-template-columns: 250px minmax(0, 1fr) 310px;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "top top top" "left view right" "left time right";
}
.top { grid-area: top; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font: 700 17px/1 var(--font-display); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
.brand b { color: var(--ember); font-weight: 700; }
.effect-name {
  background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 5px 8px;
  font: 600 15px var(--font-display); min-width: 0; width: 240px; max-width: 100%;
}
.effect-name:hover, .effect-name:focus { border-color: var(--line); background: var(--panel); }
.spacer { flex: 1; }
.btn {
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 6px 11px;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { border-color: #4a4150; }
.btn.primary { background: var(--ember); border-color: var(--ember); color: var(--ember-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 3px 8px; font-size: 12px; }
.btn.ghost { background: transparent; }
.btn.danger:hover { border-color: var(--danger); color: var(--danger); }
.btn[aria-pressed="true"] { border-color: var(--ember); color: var(--ember); background: var(--ember-soft); }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-height: 0; overflow: hidden;
  display: flex; flex-direction: column; }
.left { grid-area: left; }
.right { grid-area: right; }
.panel-head { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.panel-title { font: 600 12px var(--font-display); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.tabs { display: flex; gap: 2px; }
.tab { background: none; border: none; padding: 4px 8px; border-radius: 5px; color: var(--muted);
  font: 600 12px var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; }
.tab[aria-selected="true"] { color: var(--text); background: var(--panel-2); }
.scroll { overflow-y: auto; min-height: 0; flex: 1; padding: 8px; }

.view { grid-area: view; position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--line);
  background: #0b0a0d; min-height: 260px; }
.view canvas { display: block; width: 100%; height: 100%; }
.overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.hud { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: auto; }
.hud .btn { background: #18151bcc; backdrop-filter: blur(4px); }
.hud-right { left: auto; right: 10px; }
.dmg { position: absolute; font: 700 18px var(--font-display); color: #ffd16a; text-shadow: 0 2px 0 #000, 0 0 6px #000;
  transform: translate(-50%, -50%); white-space: nowrap; }
.dmg.crit { font-size: 26px; color: #ff9b3d; }
.dist-label { position: absolute; font: 500 11px var(--font-mono); color: var(--muted); transform: translate(-50%, -50%);
  background: #100e12aa; padding: 1px 6px; border-radius: 4px; }

.time { grid-area: time; display: flex; flex-direction: row; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 10px; }
.time input[type="range"] { flex: 1; min-width: 140px; }
.clock { font: 500 12px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--muted); min-width: 92px; }
.marks { position: relative; flex-basis: 100%; height: 6px; }
.mark { position: absolute; top: 0; width: 2px; height: 6px; background: var(--ember); border-radius: 1px; }

/* library */
.lib-group { font: 600 11px var(--font-display); color: var(--muted); letter-spacing: 0.09em; text-transform: uppercase;
  margin: 10px 4px 6px; }
.lib-group:first-child { margin-top: 2px; }
.lib-search { width: 100%; margin: 8px 0 4px; }
.preset { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: center; width: 100%; text-align: left;
  background: none; border: 1px solid transparent; border-radius: 8px; padding: 6px; }
.preset:hover { background: var(--panel-2); border-color: var(--line); }
.preset .sw { width: 34px; height: 34px; border-radius: 7px; }
.preset .nm { font-weight: 600; }
.preset .ds { color: var(--muted); font-size: 12px; line-height: 1.3; }

/* layers */
.row { display: flex; align-items: center; gap: 6px; padding: 6px 7px; border-radius: 7px; border: 1px solid transparent;
  cursor: pointer; }
.row:hover { background: var(--panel-2); }
.row.sel { border-color: var(--ember); background: var(--ember-soft); }
.row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { font: 500 10px var(--font-mono); padding: 1px 5px; border-radius: 4px; background: var(--panel-2);
  border: 1px solid var(--line); color: var(--muted); text-transform: uppercase; }
.eye { background: none; border: none; padding: 2px 4px; color: var(--muted); font-size: 13px; }
.eye.off { opacity: 0.35; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.section-label { font: 600 11px var(--font-display); color: var(--muted); letter-spacing: 0.09em; text-transform: uppercase;
  margin: 12px 4px 4px; display: flex; align-items: center; gap: 6px; }
.add-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 8px; }

/* inspector */
.field { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; align-items: center; padding: 4px 2px; }
.field > label { color: var(--muted); font-size: 12px; }
.field .ctl { display: flex; align-items: center; gap: 6px; min-width: 0; }
.field input[type="range"] { flex: 1; min-width: 0; accent-color: var(--ember); }
.field input[type="number"], .field input[type="text"], .field select {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; min-width: 0; }
.field input[type="number"] { width: 62px; font: 12px var(--font-mono); font-variant-numeric: tabular-nums; }
.field input[type="text"], .field select { width: 100%; }
.field input[type="color"] { width: 34px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 5px;
  background: none; }
.vec { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; width: 100%; }
.vec input { width: 100% !important; }
.group-title { font: 600 12px var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ember);
  margin: 14px 2px 4px; padding-top: 10px; border-top: 1px solid var(--line); }
.group-title:first-child { border-top: none; margin-top: 0; padding-top: 0; }
.hint { color: var(--muted); font-size: 12px; margin: 2px 2px 6px; }
.texgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 4px; width: 100%; }
.tex { aspect-ratio: 1; border-radius: 5px; border: 1px solid var(--line); background: #000 center / contain no-repeat;
  padding: 0; }
.tex[aria-pressed="true"] { border-color: var(--ember); box-shadow: 0 0 0 1px var(--ember); }

.modal-back { position: fixed; inset: 0; background: #000a; display: flex; align-items: center; justify-content: center;
  padding: 16px; z-index: 20; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: min(640px, 100%);
  max-height: 90%; display: flex; flex-direction: column; gap: 10px; padding: 14px; }
.modal h2 { margin: 0; font: 600 16px var(--font-display); }
.modal textarea { width: 100%; min-height: 260px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  font: 12px/1.4 var(--font-mono); padding: 8px; resize: vertical; }
.modal .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel-2);
  border: 1px solid var(--line); padding: 7px 14px; border-radius: 8px; z-index: 30; }
kbd { font: 11px var(--font-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
  padding: 0 4px; color: var(--muted); }

@media (max-width: 900px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto;
    grid-template-areas: "top" "view" "time" "right" "left"; }
  .view { height: 56vh; }
  .panel { max-height: 70vh; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">Emberforge <b>Effect Suite</b></div>
    <input class="effect-name" id="effectName" aria-label="Effect name" value="">
    <div class="spacer"></div>
    <button class="btn" id="undoBtn" title="Undo (Ctrl+Z)">Undo</button>
    <button class="btn" id="saveBtn" title="Save to My effects">Save</button>
    <button class="btn" id="importBtn">Import</button>
    <button class="btn" id="exportBtn">Export</button>
    <button class="btn primary" id="castBtn" title="Cast at the dummy (C)">Cast ▶</button>
  </header>

  <aside class="panel left">
    <div class="panel-head">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tabLayers" aria-selected="true">Layers</button>
        <button class="tab" role="tab" id="tabLibrary" aria-selected="false">Library</button>
      </div>
    </div>
    <div class="scroll" id="leftBody"></div>
  </aside>

  <section class="view" id="view">
    <div class="overlay" id="overlay"></div>
    <div class="hud">
      <button class="btn small" data-cam="side">Side</button>
      <button class="btn small" data-cam="behind">Behind Hero</button>
      <button class="btn small" data-cam="dummy">Dummy</button>
      <button class="btn small" data-cam="top">Top</button>
    </div>
    <div class="hud hud-right">
      <button class="btn small" id="pathBtn" aria-pressed="true" title="Show the projectile's path">Path</button>
      <button class="btn small" id="dmgBtn" aria-pressed="true" title="Damage numbers on hit">Numbers</button>
    </div>
  </section>

  <section class="panel time" aria-label="Timeline">
    <button class="btn small" id="playBtn" title="Play / pause (Space)">Pause</button>
    <button class="btn small" id="loopBtn" aria-pressed="true" title="Cast again when it ends">Loop</button>
    <select id="speedSel" class="btn small" aria-label="Playback speed">
      <option value="0.1">0.1×</option><option value="0.25">0.25×</option><option value="0.5">0.5×</option>
      <option value="1" selected>1×</option><option value="2">2×</option>
    </select>
    <input type="range" id="scrub" min="0" max="1" step="0.001" value="0" aria-label="Time">
    <span class="clock" id="clock">0.00 / 0.00 s</span>
    <div class="marks" id="marks"></div>
  </section>

  <aside class="panel right">
    <div class="panel-head"><span class="panel-title" id="inspTitle">Inspector</span></div>
    <div class="scroll" id="inspector"></div>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="game.js"></script>
<script src="gamedata.js"></script>
<script>
'use strict';
/* =====================================================================================================================
   Emberforge Effect Suite: a spell effect engine for designing Emberforge's visual effects against a training dummy.
   Units are yards (the game's). The Hero stands at the origin facing +X (their right is +Z); the dummy stands
   STAGE.distance yards ahead. An effect is a JSON spec (see NEW_EFFECT): layers fired on cast, carried by the
   projectile, or fired where it lands (impact), and a projectile with a shaped path.
   ===================================================================================================================== */

const $ = (id) => document.getElementById(id);
const UP = new THREE.Vector3(0, 1, 0);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const uid = () => Math.random().toString(36).slice(2, 9);
const deepCopy = (o) => JSON.parse(JSON.stringify(o));
const store = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* storage off: fine */ } },
};

function seeded(seed) {
  let s = (seed >>> 0) || 1;
  return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 1000003) / 1000003; };
}
function hashStr(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

/* ----------------------------------------------------------------------------------------------------- textures --- */
// Built-in textures, drawn white (the layer's color tints them). cols x rows: a flipbook.
const TEXTURES = {};
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function radial(ctx, x, y, r, stops) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  for (const [o, a] of stops) g.addColorStop(o, `rgba(255,255,255,${a})`);
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function noise2(seed) {
  const r = seeded(seed), n = 16, grid = [];
  for (let i = 0; i < n * n; i++) grid.push(r());
  const at = (x, y) => grid[((y % n + n) % n) * n + ((x % n + n) % n)];
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const sx = xf * xf * (3 - 2 * xf), sy = yf * yf * (3 - 2 * yf);
    return lerp(lerp(at(xi, yi), at(xi + 1, yi), sx), lerp(at(xi, yi + 1), at(xi + 1, yi + 1), sx), sy);
  };
}
function fbm(n, x, y) { return n(x, y) * 0.55 + n(x * 2.1, y * 2.1) * 0.3 + n(x * 4.3, y * 4.3) * 0.15; }
function defTex(name, label, cols, rows, draw, w = 256, h = 256) { TEXTURES[name] = { label, cols, rows, draw, w, h }; }

defTex('glow', 'Soft glow', 1, 1, (c) => radial(c, 128, 128, 128, [[0, 1], [0.25, 0.55], [0.6, 0.12], [1, 0]]));
defTex('flare', 'Flare', 1, 1, (c) => {
  radial(c, 128, 128, 70, [[0, 1], [0.3, 0.5], [1, 0]]);
  c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 4; i++) {
    c.save(); c.translate(128, 128); c.rotate(i * Math.PI / 4);
    const g = c.createLinearGradient(-128, 0, 128, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, `rgba(255,255,255,${i % 2 ? 0.45 : 0.9})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(-128, i % 2 ? -1.5 : -3, 256, i % 2 ? 3 : 6); c.restore();
  }
});
defTex('spark', 'Spark', 1, 1, (c) => {
  radial(c, 64, 64, 64, [[0, 1], [0.12, 0.9], [0.3, 0.2], [1, 0]]);
}, 128, 128);
defTex('ring', 'Ring', 1, 1, (c) => {
  const g = c.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.62, 'rgba(255,255,255,0)');
  g.addColorStop(0.82, 'rgba(255,255,255,1)'); g.addColorStop(0.9, 'rgba(255,255,255,0.6)');
  g.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = g; c.fillRect(0, 0, 256, 256);
});
defTex('shockwave', 'Shockwave', 1, 1, (c) => {
  const g = c.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.55, 'rgba(255,255,255,0.08)');
  g.addColorStop(0.86, 'rgba(255,255,255,0.9)'); g.addColorStop(0.94, 'rgba(255,255,255,0.3)');
  g.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = g; c.fillRect(0, 0, 256, 256);
});
defTex('streak', 'Streak', 1, 1, (c) => {
  c.save(); c.translate(128, 32); c.scale(1, 0.18);
  radial(c, 0, 0, 128, [[0, 1], [0.35, 0.6], [1, 0]]); c.restore();
}, 256, 64);
defTex('slash', 'Slash', 1, 1, (c) => {
  c.lineCap = 'round';
  for (let i = 0; i < 26; i++) {
    const t = i / 25; c.strokeStyle = `rgba(255,255,255,${0.06 + 0.5 * Math.sin(Math.PI * t)})`;
    c.lineWidth = 2 + 22 * Math.sin(Math.PI * t);
    c.beginPath(); c.arc(128, 210, 150, Math.PI * (1.18 + 0.64 * t) - 0.02, Math.PI * (1.18 + 0.64 * t) + 0.04); c.stroke();
  }
});
defTex('star', 'Star', 1, 1, (c) => {
  c.save(); c.translate(128, 128); c.shadowColor = '#fff'; c.shadowBlur = 24; c.fillStyle = '#fff'; c.beginPath();
  for (let i = 0; i < 10; i++) { const r = i % 2 ? 34 : 100, a = -Math.PI / 2 + i * Math.PI / 5; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  c.closePath(); c.fill(); c.restore();
});
defTex('swirl', 'Swirl', 1, 1, (c) => {
  c.translate(128, 128);
  for (let arm = 0; arm < 3; arm++) {
    for (let i = 0; i < 90; i++) {
      const t = i / 89, a = arm * 2 * Math.PI / 3 + t * 4.2, r = 10 + t * 110;
      c.fillStyle = `rgba(255,255,255,${(1 - t) * 0.5})`; c.beginPath(); c.arc(Math.cos(a) * r, Math.sin(a) * r, 3 + (1 - t) * 9, 0, 7); c.fill();
    }
  }
  radial(c, 0, 0, 60, [[0, 0.9], [1, 0]]);
});
defTex('rune', 'Rune circle', 1, 1, (c) => {
  c.translate(128, 128); c.strokeStyle = '#fff'; c.shadowColor = '#fff'; c.shadowBlur = 8;
  c.lineWidth = 4; c.beginPath(); c.arc(0, 0, 118, 0, 7); c.stroke();
  c.lineWidth = 2; c.beginPath(); c.arc(0, 0, 96, 0, 7); c.stroke(); c.beginPath(); c.arc(0, 0, 50, 0, 7); c.stroke();
  for (let i = 0; i < 24; i++) {
    c.save(); c.rotate(i * Math.PI / 12); c.fillStyle = '#fff';
    if (i % 3 === 0) c.fillRect(-3, -114, 6, 14); else c.fillRect(-1.5, -110, 3, 7); c.restore();
  }
  c.beginPath();
  for (let i = 0; i <= 6; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / 6 * 2; c.lineTo(Math.cos(a) * 92, Math.sin(a) * 92); }
  c.stroke();
});
defTex('smoke', 'Smoke (flipbook)', 4, 4, (c) => {
  const n = noise2(7);
  const img = c.createImageData(512, 512);
  for (let f = 0; f < 16; f++) {
    const cx = (f % 4) * 128, cy = Math.floor(f / 4) * 128, grow = 0.55 + f / 15 * 0.45, fade = 1 - f / 18;
    for (let y = 0; y < 128; y++) for (let x = 0; x < 128; x++) {
      const dx = (x - 64) / 64, dy = (y - 64) / 64, d = Math.sqrt(dx * dx + dy * dy) / grow;
      const v = fbm(n, x / 22 + f * 0.35, y / 22 - f * 0.2);
      const a = clamp((1 - d) * 1.6, 0, 1) * clamp(v * 1.7 - 0.35, 0, 1) * fade;
      const i = ((cy + y) * 512 + cx + x) * 4;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = 255; img.data[i + 3] = a * 255;
    }
  }
  c.putImageData(img, 0, 0);
}, 512, 512);
defTex('fire', 'Fire (flipbook)', 4, 4, (c) => {
  const n = noise2(3);
  const img = c.createImageData(512, 512);
  for (let f = 0; f < 16; f++) {
    const cx = (f % 4) * 128, cy = Math.floor(f / 4) * 128;
    for (let y = 0; y < 128; y++) for (let x = 0; x < 128; x++) {
      const u = (x - 64) / 64, v = y / 128;
      const width = 0.15 + 0.75 * Math.pow(v, 0.7);
      const flick = fbm(n, x / 18, y / 14 + f * 0.9) - 0.5;
      const body = clamp(1 - Math.abs(u + flick * 0.5 * (1 - v)) / width, 0, 1) * clamp((v - 0.05) * 3, 0, 1);

    } else if (fd.kind === 'texture') {
      const g = document.createElement('div'); g.className = 'texgrid';
      for (const name of textureNames()) {
        const b = document.createElement('button'); b.className = 'tex'; b.title = textureLabel(name);
        b.setAttribute('aria-label', textureLabel(name)); b.setAttribute('aria-pressed', name === val);
        b.style.backgroundImage = `url(${textureInfo(name).url})`;
        b.onclick = () => commit(name, true); g.append(b);
      }
      const up = document.createElement('button'); up.className = 'tex'; up.textContent = '+'; up.title = 'Add your own texture (PNG)';
      up.setAttribute('aria-label', 'Add your own texture'); up.style.fontSize = '18px';
      up.onclick = () => addTexture((name) => commit(name, true)); g.append(up);
      ctl.append(g);
    }
    row.append(lab, ctl); box.append(row);
  }
}
function addTexture(done) {
  const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/png,image/jpeg,image/webp';
  input.onchange = () => {
    const file = input.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      openModal('Add a texture', `<p class="hint">${file.name.replace(/[<>&]/g, '')}. If it is a flipbook, say how many cells across and down.</p>
        <div class="field"><label for="texCols">Columns</label><div class="ctl"><input type="number" id="texCols" value="1" min="1" max="16"></div></div>
        <div class="field"><label for="texRows">Rows</label><div class="ctl"><input type="number" id="texRows" value="1" min="1" max="16"></div></div>`,
        [['Add texture', () => {
          const name = file.name.replace(/\.[^.]+$/, '').replace(/[^\w-]/g, '_').slice(0, 40) || 'texture';
          state.spec.textures = state.spec.textures || {};
          state.spec.textures[name] = { data: reader.result, cols: +$('texCols').value || 1, rows: +$('texRows').value || 1 };
          texCache.delete(name); closeModal(); done(name); toast(`Added ${name}`);
        }]]);
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

/* ------------------------------------------------------------------------------------------------ timeline ------ */
function renderMarks() {
  const marks = $('marks'); marks.innerHTML = '';
  const probe = run.impacts.slice();
  const p = state.spec.projectile;
  if (p && p.enabled) {
    const S = startPoint(p, 0, new THREE.Vector3()), E = endPoint(p, 0, new THREE.Vector3());
    for (let i = 0; i < Math.max(1, p.count | 0); i++) probe.push((p.launchAt || 0) + i * (p.stagger || 0) + pathLength(p, S, E, i) / (p.speed || 20));
  } else probe.push(state.spec.impactAt || 0);
  for (const t of new Set(probe.map((x) => x.toFixed(2)))) {
    const m = document.createElement('div'); m.className = 'mark'; m.style.left = `calc(${(t / state.duration) * 100}% - 1px)`;
    m.title = `Impact at ${t} s`; marks.append(m);
  }
}
function updateClock() {
  $('clock').textContent = `${sim.t.toFixed(2)} / ${state.duration.toFixed(2)} s`;
  $('scrub').value = sim.t;
  $('playBtn').textContent = state.playing ? 'Pause' : 'Play';
}

/* --------------------------------------------------------------------------------------------- overlay text ----- */
const distLabel = document.createElement('div'); distLabel.className = 'dist-label'; overlay.append(distLabel);
function toScreen(p) {
  const v = p.clone().project(camera);
  return { x: (v.x * 0.5 + 0.5) * view.clientWidth, y: (-v.y * 0.5 + 0.5) * view.clientHeight, front: v.z < 1 };
}
function updateOverlay() {
  const mid = toScreen(new THREE.Vector3(STAGE.distance / 2, 0, STAGE.side / 2));
  distLabel.style.left = mid.x + 'px'; distLabel.style.top = mid.y + 'px'; distLabel.textContent = `${STAGE.distance} yd`;
  distLabel.hidden = !mid.front;
  for (const h of run.hits) {
    const age = sim.t - h.t;
    if (!STAGE.numbers || age > 1.2 || age < 0) { if (h.el) { h.el.remove(); h.el = null; } continue; }
    if (!h.el) { h.el = document.createElement('div'); h.el.className = 'dmg' + (h.crit ? ' crit' : ''); h.el.textContent = (h.crit ? '' : '') + h.amount.toLocaleString() + (h.crit ? '!' : ''); overlay.append(h.el); }
    const s = toScreen(anchorAt('target.head', h.t, new THREE.Vector3()).add(new THREE.Vector3(0, age * 1.4, (h.amount % 3 - 1) * 0.4)));
    h.el.style.left = s.x + 'px'; h.el.style.top = s.y + 'px'; h.el.style.opacity = String(clamp(1.6 - age * 1.4, 0, 1));
  }
}

/* --------------------------------------------------------------------------------------------- the loop -------- */
function setCam(name) {
  const d = STAGE.distance, s = STAGE.side;
  const c = { side: [[d / 2, 6, 15 + s / 2], [d / 2, 1.2, s / 2]], behind: [[-5.5, 3.6, 2.5], [d, 1.3, s]],
    dummy: [[d - 4.5, 2.6, s + 4.5], [d, 1.3, s]], top: [[d / 2, 24, s / 2 + 0.01], [d / 2, 0, s / 2]] }[name];
  camera.position.set(...c[0]); controls.target.set(...c[1]); controls.update();
}
function resize() {
  const w = view.clientWidth, h = view.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);
let last = performance.now();
function frame(now) {
  const real = Math.min(0.1, (now - last) / 1000); last = now;
  if (state.playing) {
    let budget = real * state.speed;
    while (budget >= STEP) { stepRun(STEP); budget -= STEP; }
    if (budget > 0) stepRun(budget);
    if (sim.t >= state.duration) {
      if (state.loop) simulateTo(0); else { state.playing = false; sim.t = state.duration; }
    }
    placeActors();
  }
  controls.update();
  renderer.render(scene, camera);
  updateOverlay(); updateClock();
  requestAnimationFrame(frame);
}

/* --------------------------------------------------------------------------------------------- import/export --- */
let modalEl = null;
function openModal(title, html, actions) {
  closeModal();
  modalEl = document.createElement('div'); modalEl.className = 'modal-back';
  modalEl.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${title}"><h2></h2><div class="mbody"></div><div class="actions"></div></div>`;
  modalEl.querySelector('h2').textContent = title; modalEl.querySelector('.mbody').innerHTML = html;
  const acts = modalEl.querySelector('.actions');
  for (const [label, fn] of [...actions, ['Close', closeModal]]) {
    const b = document.createElement('button'); b.className = 'btn' + (label === actions[0]?.[0] ? ' primary' : ''); b.textContent = label; b.onclick = fn; acts.append(b);
  }
  modalEl.onclick = (e) => { if (e.target === modalEl) closeModal(); };
  document.body.append(modalEl);
}
function closeModal() { if (modalEl) { modalEl.remove(); modalEl = null; } }
function toast(text) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = text; document.body.append(t);
  setTimeout(() => t.remove(), 1800);
}
// An imported or loaded spec, with today's defaults under it.
function readSpec(spec) {
  if (!spec || spec.format !== 'emberforge-effect') throw new Error('not an Emberforge effect spec');
  return Object.assign(NEW_EFFECT(), spec, { projectile: Object.assign(deepCopy(NEW_PROJECTILE), spec.projectile || {}) });
}
$('exportBtn').onclick = () => {
  if (LIVE) {
    return LIVE.effects.export(state.spec.name || 'effect', JSON.stringify(state.spec, null, 2))
      .then((path) => path && toast('Exported to ' + path), (e) => toast('Could not export: ' + e.message));
  }
  const json = JSON.stringify(state.spec, null, 2);
  openModal('Export effect', '<p class="hint">The effect as a spec file. Copy it, or save it as a .json file, to keep it or to bring it into the Emberforge client patch.</p><textarea id="exportText" readonly></textarea>', [
    ['Copy', () => { const ta = $('exportText'); (navigator.clipboard ? navigator.clipboard.writeText(json) : Promise.reject()).then(() => toast('Copied'), () => { ta.focus(); ta.select(); toast('Selected: press Ctrl+C'); }); }],
    ['Save .json', () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = (state.spec.name || 'effect').replace(/[^\w-]+/g, '_') + '.json'; a.click(); }],
  ]);
  $('exportText').value = json;
};
$('importBtn').onclick = () => {
  if (LIVE) {
    return LIVE.effects.import().then((text) => {
      if (!text) return;
      const spec = readSpec(JSON.parse(text)); setSpec(spec); toast('Imported ' + spec.name);
    }).catch((e) => toast('Could not read it: ' + e.message));
  }
  openModal('Import effect', '<p class="hint">Paste an effect spec, or open a .json file.</p><textarea id="importText" placeholder="{ &quot;format&quot;: &quot;emberforge-effect&quot;, ... }"></textarea>', [
    ['Import', () => {
      try {
        const spec = readSpec(JSON.parse($('importText').value));
        setSpec(spec);
        closeModal(); toast('Imported ' + spec.name);
      } catch (e) { toast('Could not read it: ' + e.message); }
    }],
    ['Open file', () => {
      const input = document.createElement('input'); input.type = 'file'; input.accept = '.json,application/json';
      input.onchange = () => { const r = new FileReader(); r.onload = () => ($('importText').value = r.result); r.readAsText(input.files[0]); };
      input.click();
    }],
  ]);
};
$('saveBtn').onclick = () => {
  if (LIVE) {
    return LIVE.effects.save(state.spec.name || 'effect', JSON.stringify(state.spec, null, 2)).then(async (path) => {
      toast('Saved to ' + path); GAME.mine = await LIVE.effects.list(); if (state.tab === 'library') renderLeft();
    }, (e) => toast('Could not save: ' + e.message));
  }
  const list = store.get('efs.library', []);
  const i = list.findIndex((s) => s.name === state.spec.name);
  if (i >= 0) list[i] = deepCopy(state.spec); else list.push(deepCopy(state.spec));
  store.set('efs.library', list); toast(`Saved "${state.spec.name}" to My effects`);
  if (state.tab === 'library') renderLeft();
};

/* --------------------------------------------------------------------------------------------- controls -------- */
$('castBtn').onclick = () => { state.playing = true; simulateTo(0); };
$('playBtn').onclick = () => { state.playing = !state.playing; if (state.playing && sim.t >= state.duration) simulateTo(0); };
$('loopBtn').onclick = () => { state.loop = !state.loop; $('loopBtn').setAttribute('aria-pressed', state.loop); };
$('speedSel').onchange = () => (state.speed = parseFloat($('speedSel').value));
$('scrub').oninput = () => { state.playing = false; simulateTo(parseFloat($('scrub').value)); };
$('undoBtn').onclick = undo;
$('pathBtn').onclick = () => { STAGE.showPath = !STAGE.showPath; $('pathBtn').setAttribute('aria-pressed', STAGE.showPath); rebuildPath(); };
$('dmgBtn').onclick = () => { STAGE.numbers = !STAGE.numbers; $('dmgBtn').setAttribute('aria-pressed', STAGE.numbers); };
$('effectName').oninput = () => edit(() => (state.spec.name = $('effectName').value));
$('tabLayers').onclick = () => { state.tab = 'layers'; renderLeft(); };
$('tabLibrary').onclick = () => { state.tab = 'library'; renderLeft(); };
document.querySelectorAll('[data-cam]').forEach((b) => (b.onclick = () => setCam(b.dataset.cam)));
document.addEventListener('keydown', (e) => {
  const typing = /input|select|textarea/i.test(e.target.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); undo(); return; }
  if (typing || modalEl) return;
  if (e.key === ' ') { e.preventDefault(); $('playBtn').click(); }
  else if (e.key.toLowerCase() === 'c') $('castBtn').click();
  else if ((e.key === 'Delete' || e.key === 'Backspace') && state.sel.kind === 'layer') {
    edit(() => { state.spec.layers = state.spec.layers.filter((l) => l.id !== state.sel.id); state.sel = { kind: 'effect' }; renderLeft(); renderInspector(); });
  }
});

/* --------------------------------------------------------------------------------------------- start ----------- */
(function start() {
  const saved = store.get('efs.current', null);
  let spec = null;
  if (saved && saved.format === 'emberforge-effect') spec = Object.assign(NEW_EFFECT(), saved, { projectile: Object.assign(deepCopy(NEW_PROJECTILE), saved.projectile || {}) });
  setSpec(spec || presetEffect(PRESETS[1]), { record: false });
  state.history = [];
  setCam('side'); resize();
  requestAnimationFrame(frame);
  loadGame();
})();
</script>
</body>
</html>
